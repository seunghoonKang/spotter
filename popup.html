<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spotter</title>
    <style>
      :root {
        --bg: #0d120e;
        --fg: #e6f0e0;
        --muted: #8a9080;
        --accent: #a3e635;
        --accent-soft: #bef264;
        --accent-dim: rgba(163, 230, 53, 0.14);
        --border: #1f2818;
        --rec: #ff3b30;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 280px;
        background: var(--bg);
        color: var(--fg);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 16px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 16px 0;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--rec);
        border-radius: 50%;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
        min-height: 16px;
      }
      .status.recording {
        color: var(--rec);
      }
      .status.success {
        color: var(--accent-soft);
      }
      button {
        width: 100%;
        padding: 10px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s;
      }
      button:hover:not(:disabled) { background: var(--border); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0d120e;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .row button { flex: 1; }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 12px;
        line-height: 1.4;
      }
      .hint b { color: var(--fg); font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Spotter</h1>
    <div class="status" id="status"></div>
    <button id="start" class="primary"></button>
    <button id="stop" disabled style="margin-top: 8px;"></button>
    <div class="hint" id="hint"></div>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
